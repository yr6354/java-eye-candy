name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Compile every source file against Java 17
        run: javac --release 17 -encoding UTF-8 -d out $(find src -name '*.java')

      - name: Smoke test - render one tiny frame with every toy
        run: |
          java src/candy/Fractal.java -w 240 -h 135 --iter 300 --ss 1 --out out/smoke-fractal.png
          java src/candy/RayTracer.java -w 160 -h 90 --aa 1 --shadow 2 --out out/smoke-ray.png
          java src/candy/GalaxySim.java -w 160 -h 90 --stars 2000 --frames 2 --out out/smoke-galaxy.gif
          java src/candy/MatrixRain.java --record out/smoke-rain.gif --record-frames 3 --cols 20
          test -s out/smoke-fractal.png && test -s out/smoke-ray.png && test -s out/smoke-galaxy.gif && test -s out/smoke-rain.gif
